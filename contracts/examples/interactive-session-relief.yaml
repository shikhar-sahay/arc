# Example contract (documentation only, not a live policy).
#
# Files in contracts/examples/ are never loaded automatically. Copy a file
# to contracts/ (the directory root, not a subdirectory) to make it live.
# The nice action below is really enforced on Linux. Lowering priority
# (raising nice) works for your own processes, but restoring back down
# may need privilege, see docs/demo.md.
version: 1
id: interactive-session-relief
name: Interactive Session Relief
description: >
  While total CPU usage stays high, a background compile worker would be
  deprioritized. When usage falls back, the restore condition ends the
  episode so prior state can be restored exactly.
enabled: true
target:
  type: process
  match:
    executable: python
    command_contains: demo_cpu_worker
trigger:
  metric: system.cpu.percent
  operator: gt
  value: 75
  for_seconds: 5
actions:
  - type: nice
    value: 10
restore:
  metric: system.cpu.percent
  operator: lt
  value: 55
  for_seconds: 5
