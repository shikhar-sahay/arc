# Example contract (documentation only, not a live policy).
#
# Files in contracts/examples/ are never loaded automatically. Copy a file
# to contracts/ (the directory root, not a subdirectory) to make it live.
# The cpu_affinity action below is really enforced on Linux. Edit the CPU
# list to match your host (check nproc and cpuset limits) before using it,
# invalid CPUs fail activation explicitly instead of being applied.
version: 1
id: memory-pressure-relief
name: Memory Pressure Relief
description: >
  While memory usage stays high and a data indexing worker is present,
  that worker would be constrained to a subset of CPUs. The separate
  restore threshold provides hysteresis against flapping.
enabled: true
target:
  type: process
  match:
    executable: python
    command_contains: index_worker
trigger:
  metric: system.memory.percent
  operator: gt
  value: 80
  for_seconds: 10
actions:
  - type: cpu_affinity
    cpus: [0, 1]
restore:
  metric: system.memory.percent
  operator: lt
  value: 60
  for_seconds: 10
