# Load with faculty-affinity-demo.yaml to demonstrate deterministic conflict deferral.
version: 1
id: faculty-affinity-conflict
name: Faculty Conflict Demonstration
description: Attempts to claim affinity already owned by the primary demonstration contract.
enabled: true
target:
  type: process
  match:
    executable: python3
    command_contains: arc-faculty-demo-target
trigger:
  metric: system.cpu.percent
  operator: gt
  value: 20
  for_seconds: 3
actions:
  - type: cpu_affinity
    cpus: [1]
restore:
  metric: system.cpu.percent
  operator: lt
  value: 10
  for_seconds: 3
